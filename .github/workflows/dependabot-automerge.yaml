name: Dependabot auto-merge

# Merges a Dependabot minor/patch PR once its checks pass on the validated head; any later push re-runs this and must re-validate.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'asaphe/slack-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      COMMITS: ${{ github.event.pull_request.commits }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: gate
        name: Allow only minor and patch updates
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          if [ "$UPDATE_TYPE" = version-update:semver-minor ] || [ "$UPDATE_TYPE" = version-update:semver-patch ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::'$UPDATE_TYPE' needs a manual merge"
          fi

      # fetch-metadata checks only the first commit; every commit up to this exact head must be a verified Dependabot commit.
      - name: Require every commit to be a verified Dependabot commit
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          if [ "$COMMITS" -lt 1 ] || [ "$COMMITS" -gt 50 ]; then
            echo "::error::PR has $COMMITS commits; auto-merge handles 1-50"
            exit 1
          fi
          list=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --jq '.[]' | jq -s '.')
          [ "$(jq 'length' <<<"$list")" -eq "$COMMITS" ] || { echo "::error::commit list is incomplete"; exit 1; }
          [ "$(jq -r '.[-1].sha' <<<"$list")" = "$HEAD_SHA" ] || { echo "::error::commit list does not end at $HEAD_SHA"; exit 1; }
          others=$(jq -r '.[] | select(.author.login != "dependabot[bot]" or (.committer.login != "web-flow" and .committer.login != "dependabot[bot]") or .commit.verification.verified != true) | .sha' <<<"$list")
          if [ -n "$others" ]; then
            echo "::error::commits not authored by Dependabot: $others"
            exit 1
          fi

      - name: Wait for quality and scan to pass on this head
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          for _ in $(seq 1 100); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "quality" or .name == "scan") | {name, status, conclusion}]')
            failed=$(jq -r '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<<"$runs")
            passed=$(jq -r '[.[] | select(.status == "completed" and .conclusion == "success") | .name] | unique | length' <<<"$runs")
            if [ "$failed" -gt 0 ]; then echo "::error::a required check failed: $runs"; exit 1; fi
            if [ "$passed" -eq 2 ]; then exit 0; fi
            sleep 15
          done
          echo "::error::checks did not finish in time"
          exit 1

      # Immediate, head-pinned merge: a commit pushed after validation makes this fail instead of merging it.
      - name: Merge
        if: steps.gate.outputs.allowed == 'true'
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"
